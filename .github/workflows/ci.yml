# SPDX-FileCopyrightText: 2026 Richard Bejtlich
#
# Builds and tests sf-mod-check (sfmodcheck until 0.8.0) on Windows and Linux, and checks that the dotnet tool package and the stand-alone
# Windows exe build. On a version tag (v0.4.0), also makes a GitHub release with the tool package
# (sf-mod-check.<version>.nupkg), the stand-alone exe zip (sf-mod-check-<version>-win-x64.zip, with the sfmodcheck.cmd
# alias) and their SHA-256 checksums.
# The runners have no game files, so the five tests that need Starfield.esm are skipped there.
name: tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.321"   # pinned: the stand-alone lock file names the SDK's ILLink version
      - name: Restore (lock files must match)
        run: dotnet restore tests/SfModCheck.Tests/SfModCheck.Tests.csproj --locked-mode
      - name: Tests
        run: dotnet test tests/SfModCheck.Tests/SfModCheck.Tests.csproj -c Release --no-restore
      - name: Tool package builds
        run: dotnet pack src/sfmodcheck.csproj -c Release -o out -p:SfModCheckPack=true -p:RestoreLockedMode=true
      - name: Stand-alone exe builds
        run: dotnet publish src/sfmodcheck.csproj -c Release -r win-x64 -o out/exe -p:SfModCheckStandalone=true -p:RestoreLockedMode=true
      - name: Stand-alone exe runs
        if: runner.os == 'Windows'
        run: out/exe/sf-mod-check.exe --version

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the GitHub release
      id-token: write   # nuget.org Trusted Publishing
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.321"   # pinned: the stand-alone lock file names the SDK's ILLink version
      - name: Tag, project version and CHANGELOG agree
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/sfmodcheck.csproj)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but src/sfmodcheck.csproj says $version"; exit 1; }
          grep -q "^## $version (20[0-9][0-9]-[0-9][0-9]-[0-9][0-9])" CHANGELOG.md || { echo "CHANGELOG.md has no dated entry for $version"; exit 1; }
          # only '## <version number>' headings start or end a section, so a '## ' line in a code example can't cut it
          awk -v v="$version" '$0 ~ "^## "v"( |$)" {on=1; next} /^## [0-9]+\.[0-9]+\.[0-9]+/ {on=0} on' CHANGELOG.md > release-notes.md
          grep -q '[^[:space:]]' release-notes.md || { echo "CHANGELOG.md has no notes in its section for $version"; exit 1; }
          printf '\nCheck each download against its .sha256 file.\n' >> release-notes.md
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Tool package
        run: dotnet pack src/sfmodcheck.csproj -c Release -o out -p:SfModCheckPack=true -p:RestoreLockedMode=true
      - name: Stand-alone exe zip
        run: |
          dotnet publish src/sfmodcheck.csproj -c Release -r win-x64 -o build/exe -p:SfModCheckStandalone=true -p:RestoreLockedMode=true
          mkdir -p build/zip
          cp build/exe/sf-mod-check.exe packaging/sfmodcheck.cmd README.md AGENTS.md LICENSE NOTICE PRIVACY.md CHANGELOG.md build/zip/
          (cd build/zip && zip -9 -X "../../out/sf-mod-check-$VERSION-win-x64.zip" *)
      - name: Checksums
        working-directory: out
        run: |
          for f in *.nupkg *.zip; do sha256sum "$f" > "$f.sha256"; done
          sha256sum -c ./*.sha256
      # The GitHub release comes first, so a failed nuget.org push leaves it standing and a rerun finishes the job. A
      # rerun never replaces a published file, because a rebuild isn't byte-identical.
      - name: Publish the GitHub release (safe to rerun, never replaces a file)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="sf-mod-check ${GITHUB_REF_NAME#v}"
          if assets=$(gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[].name' 2>&1); then
            have=0; missing=0
            for f in out/*; do
              if printf '%s\n' "$assets" | grep -qxF "$(basename "$f")"; then have=$((have+1)); else missing=$((missing+1)); fi
            done
            if [ "$missing" -gt 0 ] && [ "$have" -gt 0 ]; then
              echo "The release has $have of the files and lacks $missing. Fix it by hand; a rerun never replaces a published file."; exit 1
            fi
            if [ "$missing" -gt 0 ]; then   # an earlier run made the release, then failed: upload everything, checksums last
              gh release upload "$GITHUB_REF_NAME" $(ls out/* | grep -v '\.sha256$')
              gh release upload "$GITHUB_REF_NAME" out/*.sha256
            else
              # every file is already published: push the published package to nuget.org, not this run's rebuild,
              # so nuget.org and GitHub hold the same bytes
              rm -rf published && mkdir published
              gh release download "$GITHUB_REF_NAME" -D published -p '*.nupkg' -p '*.nupkg.sha256'
              (cd published && sha256sum -c ./*.sha256)
              rm -f out/*.nupkg && cp published/*.nupkg out/
            fi
            gh release edit "$GITHUB_REF_NAME" --title "$title" --notes-file release-notes.md --draft=false
          elif printf '%s' "$assets" | grep -q 'release not found'; then
            gh release create "$GITHUB_REF_NAME" out/* --title "$title" --notes-file release-notes.md --verify-tag
          else
            echo "gh release view failed: $assets"; exit 1
          fi
      - name: Log in to nuget.org (Trusted Publishing)
        id: nuget
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841   # v1, pinned to a commit (2026-11-16 security review)
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Push to nuget.org
        run: dotnet nuget push "out/*.nupkg" --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
